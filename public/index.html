<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رصيد الأدوية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f5;--surface:#fff;--text:#16302b;--muted:#5d7570;--line:#d9e3e0;
--g:#1f9d63;--gbg:#e3f5ec;--y:#b7860b;--ybg:#fbf1d3;--r:#d23a3a;--rbg:#fde5e5;--x:#6b7775;--xbg:#e8ecec;--accent:#0f6b5c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--bg:#0f1a18;--surface:#17262a;--text:#e6f1ee;--muted:#93aaa5;--line:#2a3f3b;
--g:#4cd08e;--gbg:#173a2b;--y:#f0c24a;--ybg:#3b3213;--r:#ff7a7a;--rbg:#41191b;--x:#a3b0ae;--xbg:#26302f;--accent:#58c7b3}}
:root[data-theme="dark"]{color-scheme:dark;
--bg:#0f1a18;--surface:#17262a;--text:#e6f1ee;--muted:#93aaa5;--line:#2a3f3b;
--g:#4cd08e;--gbg:#173a2b;--y:#f0c24a;--ybg:#3b3213;--r:#ff7a7a;--rbg:#41191b;--x:#a3b0ae;--xbg:#26302f;--accent:#58c7b3}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:720px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:1.5rem;font-weight:800;margin:0 0 2px}
.sub{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.counts button{border:2px solid transparent;border-radius:12px;padding:10px 4px;font:inherit;cursor:pointer;text-align:center;color:inherit}
.counts b{display:block;font-size:1.5rem;line-height:1.2}
.counts span{font-size:.8rem}
.counts button[aria-pressed="true"]{border-color:var(--text)}
.c-g{background:var(--gbg);color:var(--g)}.c-y{background:var(--ybg);color:var(--y)}
.c-r{background:var(--rbg);color:var(--r)}.c-x{background:var(--xbg);color:var(--x)}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;margin-bottom:12px}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
li{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;border-inline-start:8px solid var(--c)}
li .n{flex:1;font-weight:600}
li .d{font-size:.85rem;color:var(--muted)}
li .s{font-weight:800;font-size:.9rem;padding:2px 10px;border-radius:99px;background:var(--cb);color:var(--c);white-space:nowrap}
.g{--c:var(--g);--cb:var(--gbg)}.y{--c:var(--y);--cb:var(--ybg)}.r{--c:var(--r);--cb:var(--rbg)}.x{--c:var(--x);--cb:var(--xbg)}
.tools{margin-top:22px;padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;color:var(--muted)}
.tools label{display:inline-block;margin-top:6px;padding:8px 14px;background:var(--accent);color:var(--bg);border-radius:10px;font-weight:600;cursor:pointer}
.tools input{position:absolute;opacity:0;width:1px;height:1px}
.tools input:focus-visible+span{outline:3px solid var(--text);outline-offset:3px}
.empty{padding:24px;text-align:center;color:var(--muted)}
.tools[hidden]{display:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.ctl{display:flex;gap:6px;flex-shrink:0}
.ctl button{min-width:36px;height:32px;padding:0 9px;border:1px solid var(--line);border-radius:9px;background:var(--surface);color:var(--muted);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer}
.foot{margin:24px 0 0;text-align:center;font-size:.8rem;color:var(--muted)}
.tools button[disabled]{opacity:.5;cursor:not-allowed}
.ctl button.on{border-color:var(--accent);color:var(--accent)}
li .n{direction:ltr;unicode-bidi:plaintext;text-align:left}[dir="rtl"] li .n{text-align:right}
li .d{direction:inherit}
.tools .msg{display:block;margin-top:8px;font-weight:600}
.tools button{display:inline-block;margin-top:6px;padding:8px 14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<main>
<div class="top"><h1 id="t-title">رصيد الأدوية</h1>
<div class="ctl"><button type="button" id="btn-lang">EN</button><button type="button" id="btn-theme" aria-label="theme">☾</button><button type="button" id="btn-admin" aria-label="admin">🔒</button></div></div>
<p class="sub" id="sub" role="status"></p>
<div class="counts" id="counts"></div>
<input type="search" id="q" placeholder="ابحث عن دوا" aria-label="بحث عن دوا">
<ul id="list"></ul>
<div class="tools" id="tools" hidden>
  <span id="t-up">ارفعي شيت الإكسيل (أعمدة: اسم الدوا، الرصيد الحالي، المعدل الشهري) وهيتحفظ، وأي حد يفتح اللينك هيشوف آخر شيت.</span><br>
  <label><input type="file" id="f" accept=".xlsx,.xls,.csv"><span id="t-upbtn">رفع الشيت</span></label>
  <button type="button" id="btn-save" disabled>حفظ</button>
  <span class="msg" id="msg" role="status"></span>
</div>
<div class="tools" id="tools2" hidden>
  <span id="t-exp">تصدير الرصيد الحالي كملف إكسيل، أو طلبية بالأصناف اللي محتاجة طلب (تغطية 30 يوم).</span><br>
  <button type="button" id="exp-all">تصدير الرصيد (.xlsx)</button>
  <button type="button" id="exp-order">تصدير طلبية النواقص (.xlsx)</button>
</div>
<p class="foot" id="foot">من إعداد مخزن الأدوية</p>
</main>
<script type="application/json" id="seed">{"rows":[["Amikin 500mg ",0,200],["Ampicillin + sulbactam 1500mg",5976,3200],["Ampicillin + sulbactam 375mg",125,50],["Linezolid 600mg",100,300],["Aztreonam 1g",0,500],["Ceftriaxone 1g",3068,2000],["Sulperazone 1.5g",1080,300],["Ceftazedime 1g",4140,1700],["Cefotaxime 1g",7200,1700],["Klacid 500mg",50,100],["Clindamycin 600mg",664,1500],["Clindamycin 900mg",1790,1500],["Cefepime 1g",4420,1500],["Colistin",720,1000],["Cipro 200mg",0,200],["Cefazoline 1g",960,1000],["Imipenem",760,700],["Levo 500mg",200,500],["Levo 750mg",0,800],["Metronidazole",0,2000],["Meropenem 1g",4200,6000],["Meropenem 500mg",0,6000],["Piprataz 4.5g",1200,800],["Targocid 200mg",130,200],["Targocid 400mg",0,200],["Tygacil",500,800],["Vanco 1g",320,700],["Vanco 500mg",500,700],["Zavicefta 2.5g",0,100]],"updated":"2026-11-25T13:21:01.518Z"}</script>
<script>(function(){
var API="/api/stock",PIN_KEY="abx_admin_pin",PREF_KEY="abx_prefs";
var seed=JSON.parse(document.getElementById("seed").textContent);
var data=seed.rows,updated=seed.updated,filter="all";
var prefs={};try{prefs=JSON.parse(localStorage.getItem(PREF_KEY))||{}}catch(e){}
var lang=prefs.lang==="en"?"en":"ar",theme=prefs.theme||"auto",pin=null,pending=null;
try{pin=localStorage.getItem(PIN_KEY)}catch(e){}
var sub=document.getElementById("sub"),msg=document.getElementById("msg");
var L={
 ar:{dir:"rtl",title:"رصيد الأدوية",st:{g:"كافي",y:"أقل من شهر",r:"أقل من أسبوع",x:"غير متوفر"},
  search:"ابحث عن دوا",out:"الرصيد خلص",noRate:"مفيش استهلاك مسجل",days:function(d){return "يكفي حوالي "+d+" يوم"},
  empty:"مفيش أدوية بالشكل ده.",sub:"مخزون المضادات الحيوية في مستشفى جمال عبد الناصر",foot:"من إعداد مخزن الأدوية",save:"حفظ",pending:function(n){return "اتقرا الملف ("+n+" صنف). اضغطي حفظ عشان يستبدل الشيت القديم ويظهر للجميع."},upd:"آخر تحديث: ",demo:"بيانات تجريبية",
  up:"ارفعي شيت الإكسيل (أعمدة: اسم الدوا، الرصيد الحالي، المعدل الشهري) وهيتحفظ، وأي حد يفتح اللينك هيشوف آخر شيت.",upBtn:"رفع الشيت",
  exp:"تصدير الرصيد الحالي كملف إكسيل، أو طلبية بالأصناف اللي محتاجة طلب (تغطية 30 يوم).",expAll:"تصدير الرصيد (.xlsx)",expOrder:"تصدير طلبية النواقص (.xlsx)",
  askPin:"اكتبي رمز المسؤول:",badPin:"الرمز غلط.",logout:"تخرجي من وضع المسؤول؟",saving:"جاري الحفظ…",saved:"اتحفظ ✓ أي حد يفتح اللينك هيشوف الشيت ده.",
  saveFail:"الشيت ماتحفظش (فيه مشكلة مؤقتة). جربي تاني.",net:"فيه مشكلة في الاتصال. جربي تاني.",
  bad:"مقدرتش أقرا الشيت. اتأكدي إن العمود الأول اسم الدوا، التاني الرصيد، والتالت المعدل الشهري.",noOrder:"كل الأصناف مغطية 30 يوم.",
  cols:["اسم الدواء","الرصيد الحالي","المعدل الشهري","أيام التغطية","الحالة","مقترح الطلب (30 يوم)"],ocol:"الكمية المقترحة للطلب (30 يوم)",loc:"ar-EG",other:"EN"},
 en:{dir:"ltr",title:"Medicine Stock",st:{g:"Sufficient",y:"Under a month",r:"Under a week",x:"Out of stock"},
  search:"Search for a drug",out:"Out of stock",noRate:"No usage recorded",days:function(d){return "Lasts about "+d+" days"},
  empty:"No drugs match.",sub:"Antibiotic stock at Gamal Abdel Nasser Hospital",foot:"Made by Medical Warehouse",save:"Save",pending:function(n){return "File read ("+n+" items). Press Save to replace the old sheet for everyone."},upd:"Last updated: ",demo:"Sample data",
  up:"Upload the Excel sheet (columns: drug name, current stock, monthly rate). It's saved, and everyone who opens the link sees the latest sheet.",upBtn:"Upload sheet",
  exp:"Export current stock as an Excel file, or an order list of items that need ordering (30-day cover).",expAll:"Export stock (.xlsx)",expOrder:"Export order list (.xlsx)",
  askPin:"Enter the admin code:",badPin:"Wrong code.",logout:"Leave admin mode?",saving:"Saving…",saved:"Saved ✓ Everyone who opens the link sees this sheet.",
  saveFail:"The sheet wasn't saved (temporary problem). Try again.",net:"Connection problem. Try again.",
  bad:"Couldn't read the sheet. Make sure column 1 is the drug name, column 2 the stock and column 3 the monthly rate.",noOrder:"All items cover 30 days.",
  cols:["Drug name","Current stock","Monthly rate","Days of cover","Status","Suggested order (30 days)"],ocol:"Suggested order qty (30 days)",loc:"en-GB",other:"عربي"}
};
function T(){return L[lang]}
function $(id){return document.getElementById(id)}
function savePrefs(){try{localStorage.setItem(PREF_KEY,JSON.stringify({lang:lang,theme:theme}))}catch(e){}}
function status(bal,rate){
  if(!(bal>0))return{k:"x",days:0};
  if(!(rate>0))return{k:"g",days:null};
  var d=bal/rate*30;
  return{k:d<7?"r":d<30?"y":"g",days:d};
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function stamp(){return updated?T().upd+new Date(updated).toLocaleString(T().loc,{dateStyle:"medium",timeStyle:"short"}):T().demo}
function isDark(){return theme==="dark"||(theme==="auto"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
function applyTheme(){var r=document.documentElement;if(theme==="auto")r.removeAttribute("data-theme");else r.setAttribute("data-theme",theme);$("btn-theme").textContent=isDark()?"☀":"☾"}
function applyAdmin(){var on=!!pin;$("tools").hidden=!on;$("tools2").hidden=!on;$("btn-admin").textContent=on?"🔓":"🔒";$("btn-admin").classList.toggle("on",on)}
function applyLang(){
  var t=T();document.documentElement.lang=lang;document.documentElement.dir=t.dir;document.title=t.title;
  $("t-title").textContent=t.title;$("q").placeholder=t.search;$("q").setAttribute("aria-label",t.search);
  $("t-up").textContent=t.up;$("t-upbtn").textContent=t.upBtn;$("t-exp").textContent=t.exp;
  $("exp-all").textContent=t.expAll;$("foot").textContent=t.foot;$("btn-save").textContent=t.save;$("exp-order").textContent=t.expOrder;$("btn-lang").textContent=t.other;
}
function render(){
  var t=T(),ST=t.st;
  var rows=data.map(function(r){return{n:String(r[0]).trim(),b:r[1],s:status(r[1],r[2])}});
  var order={g:0,y:1,r:2,x:3};
  rows.sort(function(a,b){return order[a.s.k]-order[b.s.k]||a.n.localeCompare(b.n,"ar")});
  var cnt={g:0,y:0,r:0,x:0};rows.forEach(function(r){cnt[r.s.k]++});
  var html="";
  ["g","y","r","x"].forEach(function(k){
    html+='<button class="c-'+k+'" data-k="'+k+'" aria-pressed="'+(filter===k)+'"><b>'+cnt[k]+'</b><span>'+ST[k]+'</span></button>';
  });
  $("counts").innerHTML=html;
  document.querySelectorAll("#counts [data-k]").forEach(function(b){
    b.onclick=function(){filter=filter===b.dataset.k?"all":b.dataset.k;render()};
  });
  var q=$("q").value.trim().toLowerCase();
  var shown=rows.filter(function(r){return(filter==="all"||r.s.k===filter)&&(!q||r.n.toLowerCase().indexOf(q)>-1)});
  $("list").innerHTML=shown.length?shown.map(function(r){
    var d=r.s.k==="x"?t.out:r.s.days===null?t.noRate:t.days(Math.floor(r.s.days));
    return'<li class="'+r.s.k+'"><div class="n">'+esc(r.n)+'<div class="d" dir="'+t.dir+'">'+esc(d)+'</div></div><span class="s">'+ST[r.s.k]+'</span></li>';
  }).join(""):'<li class="empty" style="display:block;border:0">'+esc(t.empty)+'</li>';
  sub.textContent=T().sub;
}
function load(){
  fetch(API,{cache:"no-store"}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    if(d&&d.current&&d.current.rows){data=d.current.rows;updated=d.current.updated;render()}
  }).catch(function(){});
}
function checkPin(p){return fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":p},body:'{"checkOnly":true}'}).then(function(r){return r.ok})}
$("btn-admin").onclick=function(){
  var t=T();
  if(pin){if(confirm(t.logout)){pin=null;try{localStorage.removeItem(PIN_KEY)}catch(e){}msg.textContent="";applyAdmin()}return}
  var p=prompt(t.askPin);if(!p)return;p=p.trim();
  checkPin(p).then(function(ok){
    if(!ok){alert(t.badPin);return}
    pin=p;try{localStorage.setItem(PIN_KEY,p)}catch(e){}applyAdmin();
  }).catch(function(){alert(t.net)});
};
function save(rows){
  var t=T();if(!pin)return;
  msg.textContent=t.saving;$("btn-save").disabled=true;
  fetch(API,{method:"POST",headers:{"Content-Type":"application/json","x-admin-pin":pin},body:JSON.stringify({rows:rows,source:"upload"})})
  .then(function(r){
    if(r.status===401){pin=null;try{localStorage.removeItem(PIN_KEY)}catch(e){}applyAdmin();throw{m:t.badPin}}
    if(!r.ok)throw{m:t.saveFail};
    return r.json();
  }).then(function(d){
    data=d.current.rows;updated=d.current.updated;pending=null;$("btn-save").disabled=true;render();msg.textContent=t.saved;
  }).catch(function(e){msg.textContent=pending?t.pending(pending.length):"";$("btn-save").disabled=!pending;alert(e&&e.m?e.m:t.net)});
}
$("btn-save").onclick=function(){if(pending)save(pending)};
$("q").oninput=render;
$("f").onchange=function(e){
  var file=e.target.files[0];if(!file)return;
  var rd=new FileReader();
  rd.onload=function(){
    var out=[];
    try{
      var wb=XLSX.read(rd.result,{type:"array"});
      var rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1});
      rows.slice(1).forEach(function(r){
        if(r[0]!==undefined&&r[0]!==null&&String(r[0]).trim()!=="")out.push([String(r[0]).trim(),Number(r[1])||0,Number(r[2])||0]);
      });
      if(!out.length)throw 0;
    }catch(err){alert(T().bad);return}
    pending=out;data=out;render();
    msg.textContent=T().pending(out.length);$("btn-save").disabled=false;
  };
  rd.readAsArrayBuffer(file);
  e.target.value="";
};
function orderQty(bal,rate){if(!(rate>0))return 0;var n=Math.ceil(rate-bal-1e-9);return n>0?n:0}
function download(aoa,name,file){
  if(typeof XLSX==="undefined"){alert(T().net);return}
  var ws=XLSX.utils.aoa_to_sheet(aoa);ws["!cols"]=aoa[0].map(function(_,i){return{wch:i===0?32:16}});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,name);XLSX.writeFile(wb,file);
}
function today(){return new Date().toISOString().slice(0,10)}
$("exp-all").onclick=function(){
  var t=T(),aoa=[t.cols.slice()];
  data.forEach(function(r){var b=Number(r[1])||0,m=Number(r[2])||0,s=status(b,m);
    aoa.push([String(r[0]).trim(),b,m,s.days===null?"":Math.floor(s.days),t.st[s.k],orderQty(b,m)])});
  download(aoa,"Stock","antibiotic-stock-"+today()+".xlsx");
};
$("exp-order").onclick=function(){
  var t=T(),aoa=[[t.cols[0],t.cols[1],t.cols[2],t.cols[3],t.ocol]];
  data.forEach(function(r){var b=Number(r[1])||0,m=Number(r[2])||0,q=orderQty(b,m),s=status(b,m);
    if(q>0)aoa.push([String(r[0]).trim(),b,m,s.days===null?"":Math.floor(s.days),q])});
  if(aoa.length<2){alert(t.noOrder);return}
  download(aoa,"Order","antibiotic-order-"+today()+".xlsx");
};
$("btn-lang").onclick=function(){lang=lang==="ar"?"en":"ar";savePrefs();applyLang();render();msg.textContent=pending?T().pending(pending.length):""};
$("btn-theme").onclick=function(){theme=isDark()?"light":"dark";savePrefs();applyTheme()};
applyTheme();applyLang();applyAdmin();render();load();
if(pin)checkPin(pin).then(function(ok){if(!ok){pin=null;try{localStorage.removeItem(PIN_KEY)}catch(e){}applyAdmin()}}).catch(function(){});
})();</script>
</body></html>
